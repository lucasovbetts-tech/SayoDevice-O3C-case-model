name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # OpenCASCADE (cadquery) and VTK load OpenGL/X libraries even when nothing is rendered
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build the case (no renders)
        run: python sayodevice_case.py --no-render --out build
